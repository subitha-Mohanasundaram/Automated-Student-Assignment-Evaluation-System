services:
  # Single web service — worker runs as embedded background thread (no paid worker needed)
  - type: web
    name: evaluator-engine-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_app.py
    healthCheckPath: /assignments
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DEMO_AUTH
        value: "1"
      - key: INSTRUCTOR_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DISABLE_EMBEDDED_WORKER
        value: "0"
