services:
  # ── Web Service (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: evaluator-engine-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_app.py
    healthCheckPath: /assignments
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you paste the value in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: DEMO_AUTH
        value: "1"           # enables demo login (no password needed for students)
      - key: INSTRUCTOR_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Worker Service (background job processor) ─────────────────────────────
  - type: worker
    name: evaluator-engine-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
